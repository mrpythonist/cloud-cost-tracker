name: Feature request
description: Suggest an improvement to the Cloud Cost Tracker
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not just the feature. Who hits this problem and how often?
      placeholder: I have to re-upload the same CUR file every month by hand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Keep it concrete.
      placeholder: A scheduled import that reads new CUR files from an S3 bucket once a day.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve the same problem, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CSV upload and parsing
        - Reports and trends
        - Budgets and alerts
        - Dashboard UI
        - Deployment and Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the existing issues and this has not been requested yet.
          required: true
